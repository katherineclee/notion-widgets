<!DOCTYPE html>
<!-- original:https://codepen.io/boudra/pen/raErwP -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>

    <style>
        html, body {
    width: 100%;
    margin: 0;
}

        *,
        *::before,
        *::after {
    box-sizing: border-box;
}

        body {
    font-family: 'Arial', sans-serif;
    background-color: #fff;
}

.wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
  flex-direction: column;
  min-height: 100%;
  width: 100%;
}

button::-moz-focus-inner { 
  border: 0;
  padding: 0;
}

#calendari {
    margin:  0 auto;
    width: 100%;
    max-width: 100%;
    position: relative;
    font-size: clamp(11px, 2.8vw, 12px);
}
table {
    --month-color: #819774;
    --month-color-light: #ACC39F;
    --month-color-warm: #AAB78A;
    --month-color-button: #859C79;
    --month-color-button-hover: #718466;
    border-collapse: collapse;
    table-layout: fixed;
    background-color: #fff;
    border-radius: 8px;
    overflow: hidden;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    max-width: 100%;
}


td,th {
    text-align: center;
    background-color: #fff;
}
th {
    padding: clamp(6px, 2.2vw, 8px);
}
tr:first-child th {
    padding: 0;
    font-size: clamp(16px, 5.5vw, 18px);
    font-weight: bold;
    border-left: none;
    border-top: none;
    background-color: var(--month-color);
}
.calendar-header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(6px, 2.2vw, 8px);
    padding-left: clamp(50px, 16vw, 66px);
    padding-right: clamp(50px, 16vw, 66px);
    background: linear-gradient(
        90deg,
        var(--month-color-light),
        var(--month-color),
        var(--month-color-warm)
    );
    background: linear-gradient(
        90deg,
        color-mix(in srgb, var(--month-color) 85%, white),
        var(--month-color),
        color-mix(in srgb, var(--month-color) 80%, #E0B57A)
    );
}
.calendar-controls {
    position: absolute;
    left: clamp(8px, 2.4vw, 12px);
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: clamp(6px, 1.6vw, 8px);
}
.calendar-title {
    display: block;
    min-width: 0;
    text-align: center;
}
td:last-child, th:last-child {
  border-right: none;
}

th {
    border-top: 1px solid rgba(0,0,0,0.1);
    border-right: 1px solid rgba(0,0,0,0.1);
    background-color: var(--month-color);
    color: #fff;
    text-shadow: 0px -1px 0px rgba(0,0,0,0.2);
    font-weight: normal;
}
th .any {
    font-size: clamp(10px, 3.4vw, 12px);
    font-weight: normal;
    display: block;
    text-shadow: none;
    color: rgba(255,255,255,0.82);
}
tr:nth-child(2) th {
    padding: clamp(4px, 1.8vw, 6px);
    font-size: clamp(10px, 3.6vw, 12px);
    background-color: var(--month-color-light);
}
td {
    padding: 0;
    border-bottom: 1px solid rgba(0,0,0,0.05);
}
td>span {
    color: #555;
    padding: clamp(10px, 3.4vw, 14px) 0;
    display: block;
    border: 1px solid transparent;
    transition: border 0.3s ease;
    font-size: clamp(11px, 4vw, 14px);
}

td:nth-child(even)>span {
    background-color: rgba(0,0,0,0.02);
}
td.avui>span {
    font-weight: bold;
    background-color: var(--month-color);
    color: #fff;
    border: 1px solid rgba(0,0,0,0.1);
}
td.fora > span {
    opacity: 0.2;
}
td > span:hover {
    background: var(--month-color-light);
    color: #555;
}
td.avui > span:hover {
    background-color: var(--month-color);
    color: #fff;
}
.boto-next, .boto-prev {
    background-color: var(--month-color-light);
    color: #fff;
    font-family: inherit;
    border: none;
    font-size: clamp(12px, 3.4vw, 14px);
    font-weight: bold;
    text-shadow: inherit;
    padding: 0;
    line-height: 1;
    height: clamp(20px, 6.5vw, 24px);
    width: clamp(20px, 6.5vw, 24px);
    border-radius: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
}
.boto-next:hover,
.boto-prev:hover {
    background-color: var(--month-color-button);
}
button:hover { cursor: pointer; }
button:focus { outline: none; }

footer {
  text-align: center;
  color: #ddd;
  font-weight: normal;
  text-shadow: 0px -1px 0px rgba(0, 0, 0, 0.2);
  font-size: 0.8em;
  padding: 20px;
}

footer a,
footer a:link {
  color: #fff;
  text-decoration: none;
}
    </style>
</head>
<body>
    <div class="">
        <div id="calendari"></div>
      </div>
      <script>
        var mesos = [
    'January',
    'February',
    'March',
    'April',
    'May',
    'June',
    'July',
    'August',
    'September',
    'October',
    'November',
    'December'
];

var dies = [
    'Sunday',
    'Monday',
    'Tuesday',
    'Wedensday',
    'Thursday',
    'Friday',
    'Saturday'
];

var dies_abr = [
    'Su',
    'M',
    'T',
    'W',
    'Th',
    'F',
    'S'
];

var colors_mes = [
    {
        base: '#8F9CA3',
        light: '#BAC8CF',
        warm: '#B8BCB8',
        button: '#94A2A9',
        buttonHover: '#7D898F'
    },
    {
        base: '#9BA19E',
        light: '#C7CDCA',
        warm: '#C4C1B3',
        button: '#A1A7A4',
        buttonHover: '#888D8B'
    },
    {
        base: '#969F86',
        light: '#C2CBB2',
        warm: '#BFBF9C',
        button: '#9CA58B',
        buttonHover: '#848C76'
    },
    {
        base: '#8B9C7C',
        light: '#B6C8A7',
        warm: '#B4BC91',
        button: '#90A280',
        buttonHover: '#7A896D'
    },
    {
        base: '#819774',
        light: '#ACC39F',
        warm: '#AAB78A',
        button: '#859C79',
        buttonHover: '#718466'
    },
    {
        base: '#8B9471',
        light: '#B7C09C',
        warm: '#B5B587',
        button: '#909A75',
        buttonHover: '#7A8263'
    },
    {
        base: '#A4906D',
        light: '#D0BC97',
        warm: '#CDB183',
        button: '#AA9671',
        buttonHover: '#907F60'
    },
    {
        base: '#AC8B67',
        light: '#D9B791',
        warm: '#D5AC7D',
        button: '#B2906B',
        buttonHover: '#977A5B'
    },
    {
        base: '#A37E58',
        light: '#CFA981',
        warm: '#CC9F6E',
        button: '#A9835B',
        buttonHover: '#8F6F4D'
    },
    {
        base: '#A36D51',
        light: '#CF977A',
        warm: '#CC8F68',
        button: '#A97154',
        buttonHover: '#8F6047'
    },
    {
        base: '#95665D',
        light: '#C19087',
        warm: '#BE8874',
        button: '#9B6A61',
        buttonHover: '#835A52'
    },
    {
        base: '#816F81',
        light: '#AC99AC',
        warm: '#AA9096',
        button: '#857385',
        buttonHover: '#716171'
    }
];

Number.prototype.pad = function(num) {
    var str = '';
    for(var i = 0; i < (num-this.toString().length); i++)
        str += '0';
    return str += this.toString();
}

function actualitzaAlcada(widget)
{
    var taulaActiva = widget.getElementsByClassName('actiu')[0] ||
        widget.getElementsByTagName('table')[0];

    if(taulaActiva)
        widget.style.height = taulaActiva.offsetHeight + 'px';
}

function mateixDia(a, b)
{
    return a.getFullYear() == b.getFullYear() &&
        a.getMonth() == b.getMonth() &&
        a.getDate() == b.getDate();
}

function mesVisible(data)
{
    return new Date(data.getFullYear(), data.getMonth(), 1);
}

function mouMes(data, increment)
{
    return new Date(data.getFullYear(), data.getMonth() + increment, 1);
}

function aplicaTemaMes(element, monthIndex)
{
    var colors = colors_mes[monthIndex];

    element.style.setProperty('--month-color', colors.base);
    element.style.setProperty('--month-color-light', colors.light);
    element.style.setProperty('--month-color-warm', colors.warm);
    element.style.setProperty('--month-color-button', colors.button);
    element.style.setProperty('--month-color-button-hover', colors.buttonHover);
}

function calendari(widget, data, avui)
{
    var vista = mesVisible(data);

    var original = widget.getElementsByClassName('actiu')[0];

    if(typeof original === 'undefined')
    {
        original = document.createElement('table');
        original.setAttribute('data-actual', vista.getTime())
        widget.appendChild(original);
    }

    var originalActual = new Date(Number(original.getAttribute('data-actual')));
    var diff =
        (vista.getFullYear() - originalActual.getFullYear()) * 12 +
        (vista.getMonth() - originalActual.getMonth());

    var e = document.createElement('table');

    e.className = diff  === 0 ? 'amagat-esquerra' : 'amagat-dreta';
    e.innerHTML = '';
    aplicaTemaMes(e, vista.getMonth());

    widget.appendChild(e);

    e.setAttribute('data-actual', vista.getTime())

    var fila = document.createElement('tr');
    var titol = document.createElement('th');
    titol.setAttribute('colspan', 7);
    var header = document.createElement('div');
    header.className = 'calendar-header';
    var controls = document.createElement('div');
    controls.className = 'calendar-controls';

    var boto_prev = document.createElement('button');
    boto_prev.className = 'boto-prev';
    boto_prev.innerHTML = '&#9666;';

    var boto_next = document.createElement('button');
    boto_next.className = 'boto-next';
    boto_next.innerHTML = '&#9656;';

    var titolText = document.createElement('span');
    titolText.className = 'calendar-title';
    titolText.innerHTML =
        mesos[vista.getMonth()] + '<span class="any">' + vista.getFullYear() + '</span>';

    controls.appendChild(boto_prev);
    controls.appendChild(boto_next);
    header.appendChild(controls);
    header.appendChild(titolText);
    titol.appendChild(header);

    boto_prev.onclick = function() {
        calendari(widget, mouMes(vista, -1), avui);
    };

    boto_next.onclick = function() {
        calendari(widget, mouMes(vista, 1), avui);
    };

    fila.appendChild(titol);
    e.appendChild(fila);

    fila = document.createElement('tr');

    for(var i = 0; i < 7; i++)
    {
        fila.innerHTML += '<th>' + dies_abr[i] + '</th>';
    }
    e.appendChild(fila);

    /* Obtinc el dia que va acabar el mes anterior */
    var inici_mes =
        new Date(vista.getFullYear(), vista.getMonth(), 1).getDay();

    var actual = new Date(vista.getFullYear(),
			  vista.getMonth(),
			  1 - inici_mes);

    /* 6 setmanes per cobrir totes les posiblitats
     *  Quedaria mes consistent alhora de mostrar molts mesos 
     *  en una quadricula */
    for(var s = 0; s < 6; s++)
    {
        var fila = document.createElement('tr');

        for(var d = 1; d < 8; d++)
        {
	    var cela = document.createElement('td');
	    var span = document.createElement('span');

	    cela.appendChild(span);

            span.innerHTML = actual.getDate();

            if(actual.getMonth() !== vista.getMonth())
                cela.className = 'fora';

            /* Si es avui el decorem */
            if(mateixDia(avui, actual))
		cela.className = 'avui';

	    actual.setDate(actual.getDate()+1);
            fila.appendChild(cela);
        }

        e.appendChild(fila);
    }

    actualitzaAlcada(widget);

    setTimeout(function() {
        e.className = 'actiu';
        original.className +=
        diff === 0 ? ' amagat-dreta' : ' amagat-esquerra';
        actualitzaAlcada(widget);
    }, 20);

    original.className = 'inactiu';

    setTimeout(function() {
        var inactius = document.getElementsByClassName('inactiu');
        for(var i = 0; i < inactius.length; i++)
            widget.removeChild(inactius[i]);
        actualitzaAlcada(widget);
    }, 1000);

}

var avui = new Date();
calendari(document.getElementById('calendari'), avui, avui);

window.addEventListener('resize', function() {
    actualitzaAlcada(document.getElementById('calendari'));
});

    </script>
</body>
</html>
